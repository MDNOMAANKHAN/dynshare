{% extends "base.html" %}

{% block title %}Register - DynaShare{% endblock %}

{% block content %}
<div class="auth-forms">
    <div class="form-card">
        <h1>Register for DynaShare</h1>
        <h2>Register</h2>
        <form action="{{ url_for('register') }}" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="{{ username if username else '' }}" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Register</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
