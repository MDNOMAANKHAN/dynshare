{% extends "base.html" %}

{% block title %}Login - DynaShare{% endblock %}

{% block content %}
<div class="auth-forms">
    <div class="form-card">
        <h1>Login to DynaShare</h1>
        <h2>Login</h2>
        <form action="{{ url_for('login') }}" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="{{ username if username else '' }}" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</div>
{% endblock %}
